# example config for the morphing page: 0 = source instrument, 100 = target instrument

testname: Evaluation of timbre transfer interpolation quality
testId: morphing_example
bufferSize: 2048
stopOnErrors: true
showButtonPreviousPage: true
remoteService: service/write.php


pages:
  -
    - type: consent
      id: consent_page
      name: Consent
      mustConsent: true
      content: >-
        <p>Thank you for your interest in this research.<br><br>

        <b>Should you wish to participate in the study, please read our
        <a href="https://drive.google.com/file/d/1B7LfS9TGBip3Cl24mF-lKUk1kqIQ3-9M/view?usp=sharing" target="_blank" rel="noopener noreferrer">
        Participant Information Sheet</a>.</b><br><br>
        <b>Please read the following statements and indicate your agreement.</b><br><br>

        1. I confirm that I have read the Participant Information Sheet dated 28/07/2026 version 1.1 for the above study.<br>
        2. I understand that my participation is voluntary and that I am free to stop taking part in the study at any time during participation without giving any reason and without my rights being affected.<br>
        3. I understand that my data will be accessed by the research team.<br>
        4. I understand that my data will be securely stored in the UK and in accordance with the data protection guidelines of Queen Mary University of London until September 2031 in fully anonymised form.<br>
        5. I understand that I can't request the collected data to be destroyed, as it will be anonymised since data collection.<br>
        6. I understand that the collected data may be used in publications or related presentations.<br>
        7. I agree to take part in the above study.<br><br>

        <b>Do you consent to take part in this listening test with the above terms?</b></p>
    
    - type: volume
      id: vol
      name: Volume settings
      content: Please adjust the volume until you are comfortable with the sound level. Make sure to use headphones during the listening test.
      stimulus: configs/resources/audio/AuSep_2_vn_09_Jesus_cropped_5000_12819.wav
      defaultVolume: 0.5

