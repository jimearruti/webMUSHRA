  -
    - type: finish
      name: Thank you
      content: >-
        We'd like to know a bit about you. Please answer the following questions about age, gender and musical occupation. <br><br>
        If you have any comments on the experiment, please write them in the comment box. <br><br>
        Thank you for your time and participation, and <b>please remember to press "send results"!</b>
      popupContent: Your results were sent. Goodbye and have a nice day!
      showResults: true
      writeResults: true
      questionnaire:
          - type: likert
            name: age
            label: Age
            response:
             - value: 18-24
               label: 18-24
             - value: 25-34
               label: 25-34
             - value: 35-44
               label: 35-44
             - value: 45-54
               label: 45-54
             - value: 55-64
               label: 55-64
             - value: 65+
               label: 65+

          - type: likert
            name: gender
            label: Gender
            response:
             - value: female
               label: Female
             - value: male
               label: Male
             - value: non_binary
               label: Non-binary
             - value: not_disclose
               label: Prefer not to disclose
             - value: self_describe
               label: Prefer to self-describe
          
          - type: text
            name: gender_self_describe
            label: Gender (if self-describe)
            optional: true

          - type: number
            label: Years of musical experience
            name: years_musical_experience
            min: 0
            max: 100
            default: ""
            
          - type: multiple_choice
            name: musical_occupation
            label: Musical occupation (select all that apply)
            response:
             - value: musician
               label: Musician
             - value: composer
               label: Composer
             - value: sound_designer
               label: Sound Designer
             - value: music_producer
               label: Music Producer
             - value: other
               label: Other (please specify)
          - type: text
            name: musical_occupation_self_describe
            label: Musical Occupation (if other)
            optional: true

          - type: long_text
            name: comments
            label: Final comments (optional)
            optional: true
